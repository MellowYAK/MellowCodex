[project]
name = "local-agent-hub"
version = "0.22.1"
description = "Local Windows agent with durable tasks and visual evidence"
requires-python = ">=3.12"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "httpx==0.28.1", "pydantic==2.14.3", "pillow==13.0.0", "mss==10.2.0", "pywinauto==0.6.9", "agent-framework-core==1.24.0", "mcp==2.3.0", "windows-mcp==0.8.5", "playwright==1.64.1", "psutil==7.2.2", "websockets==17.4", "pypdf==6.21.4", "python-docx==1.2.0", "openpyxl==3.1.5", "pymupdf==2.1"]

[project.optional-dependencies]
desktop = ["PySide6-Essentials==6.12.0", "PySide6-Addons==6.12.0", "PySide6-WebEngine==6.12.0.140"]
test = ["pytest==9.2.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
